name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }\" | grep -q 1"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test                      # in-memory engine
      - run: npm test                      # same suite against real MongoDB
        env: { MONGODB_TEST_URI: "mongodb://localhost:27017/?replicaSet=rs0&directConnection=true" }
      - run: npm run build
        env: { MONGODB_URI: "memory", APP_SECRET: "ci-secret-ci-secret-ci-secret-0123456789" }
